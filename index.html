  <audio id="pressaSound" src="pressa/freesound_community-homemade-hydraulic-hoist-30527.mp3" preload="auto"></audio>
  <audio id="canCrush1" src="can%20crush/davidgallie-crushed-can-139334.mp3" preload="auto"></audio>
  <audio id="canCrush2" src="can%20crush/freesound_community-crushed-can-89783.mp3" preload="auto"></audio>
  <audio id="canCrush3" src="can%20crush/freesound_community-crushing-aluminum-can-101994.mp3" preload="auto"></audio>
  <audio id="canCrush4" src="can%20crush/freesound_community-empty-soda-can-27819.mp3" preload="auto"></audio>
  <audio id="canCrush5" src="can%20crush/mrstokes302-crush-can-sfx-mrstokes302-446361.mp3" preload="auto"></audio>
  <script>
(function() {
  const chars = {
    giallo: { normal: 'giallo', crushed: 'giallo_schiacciato' },
    viola: { normal: 'viola', crushed: 'viola_schiacciato' },
    verde: { normal: 'verde', crushed: 'verde_schiacciato' },
    blu: { normal: 'blu', crushed: 'blu_schiacciato' },
    arancione: { normal: 'arancione', crushed: 'arancione_schiacciato' },
    rosso: { normal: 'rosso', crushed: 'rosso_schiacciato' }
  };

  // Get all elements
  const els = {};
  for (const [name, ids] of Object.entries(chars)) {
    els[name] = document.getElementById(ids.normal);
    els[name + '_crushed'] = document.getElementById(ids.crushed);
  }

  // Verify elements exist
  for (const [key, el] of Object.entries(els)) {
    if (!el) {
      console.error('Elemento mancante:', key);
      return;
    }
  }

  // Setup transitions on crushed characters for slide-out
  for (const [name, ids] of Object.entries(chars)) {
    els[name + '_crushed'].style.transition = 'transform 1.5s ease-in-out';
    els[name].style.transition = 'transform 1.2s ease-in-out';
  }

  // Initial state: all normal positioned above, all crushed hidden, transforms reset
  function resetAll() {
    for (const [name, ids] of Object.entries(chars)) {
      els[name].style.transition = 'none';
      els[name].style.transform = 'translateY(-2000px)';
      els[name].style.visibility = 'visible';
      // Snap crushed transform back without animation
      els[name + '_crushed'].style.visibility = 'hidden';
      els[name + '_crushed'].style.transition = 'none';
      els[name + '_crushed'].style.transform = '';
      void els[name + '_crushed'].offsetWidth;
      els[name + '_crushed'].style.transition = 'transform 1.5s ease-in-out';
      void els[name].offsetWidth;
      els[name].style.transition = 'transform 1.2s ease-in-out';
    }
  }

  // Drop in all normal characters from above
  function dropInNormals() {
    for (const [name, ids] of Object.entries(chars)) {
      els[name].style.transform = 'translateY(0)';
    }
  }

  // Crush a character (hide normal, show crushed, then drop it + sound)
  function crush(name) {
    els[name].style.visibility = 'hidden';
    els[name + '_crushed'].style.visibility = 'visible';
    playCanCrushSound();
    // Fa cadere la lattina schiacciata dopo 0.5 secondi
    setTimeout(function(){
      els[name + '_crushed'].style.transform = 'translateY(2500px)';
    }, 500);
  }

  const pressa = document.getElementById('pressa');
  const audio = document.getElementById('pressaSound');

  // Array di suoni can crush
  const canCrushSounds = [
    document.getElementById('canCrush1'),
    document.getElementById('canCrush2'),
    document.getElementById('canCrush3'),
    document.getElementById('canCrush4'),
    document.getElementById('canCrush5')
  ];

  function playCanCrushSound() {
    // Sceglie un suono casuale tra quelli disponibili
    const sound = canCrushSounds[Math.floor(Math.random() * canCrushSounds.length)];
    if (sound) {
      sound.currentTime = 0;
      sound.play().catch(function(e){});
      // Ferma dopo 0.8 secondi (solo l'impatto)
      setTimeout(function(){ sound.pause(); }, 800);
    }
  }

  function playPressaSoundDown() {
    if (audio) {
      audio.currentTime = 2; // parte dal secondo 0:02
      audio.play().catch(function(e){});
    }
  }
  function playPressaSoundUp() {
    if (audio) {
      audio.currentTime = 8; // parte dal secondo 0:08
      audio.play().catch(function(e){});
    }
  }
  function stopPressaSound() {
    if (audio) {
      audio.pause();
    }
  }

  function movePressa(x, y, duration) {
    if (duration !== undefined) pressa.style.transitionDuration = duration + 's';
    pressa.style.transform = 'translate(' + x + 'px, ' + y + 'px)';
    if (y > 0) {
      // Scende: suono idraulico da 0:02, stop quando arriva in basso
      playPressaSoundDown();
      setTimeout(stopPressaSound, (duration || 1.2) * 1000);
    } else {
      // Torna su: suono da 0:08 a 0:09 (1 secondo)
      playPressaSoundUp();
      setTimeout(stopPressaSound, 1000);
    }
  }

  // Timeline: ciclo completo
  // La pressa inizia in alto (Y=0) sopra Giallo (dal CSS)
  function runCycle() {
    resetAll();
    // 0.0s: tutti i normali sono sopra il frame (nascosti fuori schermo)
    // 0.1s -> 1.3s: i personaggi interi cadono nella loro posizione
    setTimeout(function(){ dropInNormals(); }, 100);
    // 2.5s -> 3.7s: scende su Giallo
    setTimeout(function(){ movePressa(-5, 900, 1.2); }, 2500);
    setTimeout(function(){ playCanCrushSound(); }, 2700);
    setTimeout(function(){ crush('giallo'); }, 3700);
    // 3.7s -> 4.9s: risale in alto
    setTimeout(function(){ movePressa(-5, 0, 1.2); }, 3900);
    // 4.9s -> 6.1s: si sposta su Viola (in alto)
    setTimeout(function(){ movePressa(-322, 0, 1.2); }, 5100);
    // 6.1s -> 7.3s: scende su Viola
    setTimeout(function(){ movePressa(-322, 900, 1.2); }, 6300);
    setTimeout(function(){ playCanCrushSound(); }, 6500);
    setTimeout(function(){ crush('viola'); }, 7500);
    // 7.3s -> 8.5s: risale in alto
    setTimeout(function(){ movePressa(-322, 0, 1.2); }, 7700);
    // 8.5s -> 9.7s: si sposta su Verde (in alto)
    setTimeout(function(){ movePressa(-637, 0, 1.2); }, 8900);
    // 9.7s -> 10.9s: scende su Verde
    setTimeout(function(){ movePressa(-637, 900, 1.2); }, 10100);
    setTimeout(function(){ playCanCrushSound(); }, 10300);
    setTimeout(function(){ crush('verde'); }, 11300);
    // 10.9s -> 12.1s: risale in alto
    setTimeout(function(){ movePressa(-637, 0, 1.2); }, 11500);
    // 12.1s -> 13.3s: si sposta su Blu (in alto)
    setTimeout(function(){ movePressa(-5, 0, 1.2); }, 12700);
    // 13.3s -> 14.5s: scende su Blu
    setTimeout(function(){ movePressa(-5, 460, 1.2); }, 13900);
    setTimeout(function(){ playCanCrushSound(); }, 14100);
    setTimeout(function(){ crush('blu'); }, 15100);
    // 14.5s -> 15.7s: risale in alto
    setTimeout(function(){ movePressa(-5, 0, 1.2); }, 15300);
    // 15.7s -> 16.9s: si sposta su Arancione (in alto)
    setTimeout(function(){ movePressa(-322, 0, 1.2); }, 16500);
    // 16.9s -> 18.1s: scende su Arancione
    setTimeout(function(){ movePressa(-322, 460, 1.2); }, 17700);
    setTimeout(function(){ playCanCrushSound(); }, 17900);
    setTimeout(function(){ crush('arancione'); }, 18900);
    // 18.1s -> 19.3s: risale in alto
    setTimeout(function(){ movePressa(-322, 0, 1.2); }, 19100);
    // 19.3s -> 20.5s: si sposta su Rosso (in alto)
    setTimeout(function(){ movePressa(-637, 0, 1.2); }, 20300);
    // 20.5s -> 21.7s: scende su Rosso
    setTimeout(function(){ movePressa(-637, 460, 1.2); }, 21500);
    setTimeout(function(){ playCanCrushSound(); }, 21700);
    setTimeout(function(){ crush('rosso'); }, 22700);
    // 21.7s -> 22.9s: scorre a destra verso posizione iniziale sopra Giallo
    setTimeout(function(){ movePressa(-5, 0, 1.2); }, 22900);
  }

  runCycle();
  setInterval(runCycle, 25000);
})();
  </script>
